<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
:root{
--vscode-sideBar-background:#181818;--vscode-foreground:#cccccc;--vscode-descriptionForeground:#9d9d9d;--vscode-widget-border:#2b2b2b;
--vscode-button-background:#0078d4;--vscode-button-foreground:#fff;--vscode-button-hoverBackground:#026ec1;--vscode-focusBorder:#0078d4;
--vscode-input-background:#1f1f1f;--vscode-input-foreground:#ccc;--vscode-input-border:#3c3c3c;--vscode-editor-background:#1f1f1f;
--vscode-textCodeBlock-background:#2a2a2a;--vscode-toolbar-hoverBackground:#2a2d2e;--vscode-list-activeSelectionBackground:#04395e;--vscode-list-activeSelectionForeground:#fff;
--vscode-textLink-foreground:#4daafc;--vscode-errorForeground:#f85149;--vscode-editorWarning-foreground:#cca700;--vscode-testing-iconPassed:#73c991;
--vscode-font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--vscode-font-size:13px;--vscode-editor-font-family:Menlo,monospace;
--vscode-scrollbarSlider-background:rgba(121,121,121,.4);--vscode-chat-requestBackground:#1f1f1f;--vscode-chat-requestBorder:#2b2b2b;--vscode-editorWidget-background:#202020;
--vscode-input-placeholderForeground:#8b8b8b;--vscode-diffEditor-insertedLineBackground:rgba(46,160,67,.2);--vscode-diffEditor-removedLineBackground:rgba(248,81,73,.2);
}
body{margin:0}
</style>
<link rel="stylesheet" href="../media/chat.css"></head>
<body>
<div id="app">
  <div id="progress" class="progress hidden"></div>
  <header id="tabbar" class="tabbar"><nav id="tabs" class="tabs"></nav><button id="btnNewTab" class="ib"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button><button id="btnHistory" class="ib badge" data-n="0"><svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v2.2h2.2M8 5v3l2 1.5"/></svg></button></header>
  <div id="bgruns" class="bgruns hidden"></div>
  <main id="messages"></main>
  <div id="approvals"></div>
  <footer id="composer">
    <div id="tasks" class="panel hidden"><button id="tasksToggle" class="panel-head"><span class="chev"><svg viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></svg></span><span id="tasksLabel">Tasks</span><span class="spacer"></span><span id="tasksMeter" class="meter"><i></i></span></button><ul id="tasksList" class="panel-body"></ul></div>
    <div id="changes" class="panel hidden"><div class="panel-head"><button id="changesToggle" class="panel-toggle"><span class="chev"><svg viewBox="0 0 16 16"><path d="M6 4l4 4-4 4"/></svg></span><span id="changesLabel"></span></button><span class="spacer"></span><button class="btn ghost" data-a="undoAll"><svg viewBox="0 0 16 16"><path d="M3 7h7a3 3 0 0 1 0 6H8M3 7l3-3M3 7l3 3"/></svg><span class="long">Reject all</span></button><button class="btn primary" data-a="keepAll"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg><span class="long">Accept all</span></button></div><ul id="changesList" class="panel-body hidden"></ul></div>
    <div id="status" class="status hidden"><span class="spinner"></span><span id="statusText" class="text"></span></div>
    <div id="box" class="box">
      <div class="ctx-row"><button id="btnAddCtx" class="ctxbtn"><span class="at">@</span><span class="lbl">Add context</span></button><div id="chips" class="chips"></div></div>
      <textarea id="input" rows="1" placeholder="Plan, build, fix anything… (@ context, / commands)"></textarea>
      <div class="row">
        <button id="modeBtn" class="pick mode"><span id="modeIcon" class="ico"></span><span id="modeLabel" class="lbl">Agent</span><span class="chev"><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></span></button>
        <button id="modelBtn" class="pick model"><span class="ico"><svg viewBox="0 0 16 16"><path d="M3.5 5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v5a1.5 1.5 0 0 1-1.5 1.5H8l-2.5 2v-2H5A1.5 1.5 0 0 1 3.5 10z"/></svg></span><span id="modelLabel" class="lbl">Auto</span><span class="chev"><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></span></button>
        <button id="skillsBtn" class="pick skills" title="Skills for this chat"><span class="ico"><svg viewBox="0 0 16 16"><path d="M3 3h4a2 2 0 0 1 2 2v9a1.5 1.5 0 0 0-1.5-1.5H3zM13 3H9a2 2 0 0 0-2 2v9a1.5 1.5 0 0 1 1.5-1.5H13z"/></svg></span><span id="skillsLabel" class="lbl">Skills</span><span class="chev"><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></span></button>
        <span class="spacer"></span>
        <button id="btnImage" class="ib"><svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/></svg></button>
        <button id="ctxMeter" class="ctx"><span class="ring"></span><span class="txt">0%</span></button>
        <button id="btnSend" class="send"><svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg></button>
        <button id="btnPause" class="send pause hidden"><svg viewBox="0 0 16 16"><path d="M5.5 3.5v9M10.5 3.5v9" stroke-width="2.2"/></svg></button>        <button id="btnStop" class="send stop hidden"><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg></button>
      </div>
    </div>
  </footer>
  <div id="popover" class="popover hidden"></div>
  <div id="toasts"></div>
</div>
<script>
const listeners=[]; const paused={};
window.acquireVsCodeApi=()=>({postMessage(m){
  const send=(d)=>window.dispatchEvent(new MessageEvent('message',{data:d}));
  if(m.type==='ready'){
    const models=[{id:'ollama/qwen2.5-coder:14b',providerId:'ollama',name:'qwen2.5-coder:14b',contextWindow:32768,supportsTools:true},{id:'lmstudio/qwen2.5-vl',providerId:'lmstudio',name:'qwen2.5-vl-7b',contextWindow:32768,supportsTools:true,supportsVision:true}];
    send({type:'init',sessions:[{id:'s1',title:'Make dice parser friendlier',updatedAt:Date.now(),messageCount:6,mode:'agent'},{id:'s2',title:'Write tests for utils',updatedAt:Date.now()-5000,messageCount:2,mode:'agent'}],models,defaultModel:'ollama/qwen2.5-coder:14b',skills:[{name:'pdf',description:'Read, create and edit PDF files'},{name:'release',description:'Cut a release end to end'},{name:'debug',description:'Reproduce, localise and fix a bug'}],agents:[],skillsMode:'auto',running:['s2']});
    const oldT="def roll_dice(notation):\n    m = re.match(r'(\\d+)d(\\d+)', notation)\n    if not m:\n        raise ValueError('bad')\n    count, sides = int(m[1]), int(m[2])";
    const newT="def roll_dice(notation: str) -> int:\n    \"\"\"Roll dice such as '3d6+2', 'd20' or '2d10 - 1'.\"\"\"\n    m = re.fullmatch(r'\\s*(\\d*)\\s*d\\s*(\\d+)\\s*([+-]\\s*\\d+)?\\s*', notation, re.I)\n    if not m:\n        raise ValueError(f'Invalid dice notation: {notation!r}')\n    count = int(m.group(1) or 1)\n    sides = int(m.group(2))";
    const session={id:'s1',title:'Make dice parser friendlier',mode:/plan=1/.test(location.search)?'plan':'multitask',model:'',contextTokens:9800,compactions:0,
      todos:[{id:'1',title:'Read dice.py and tests',status:'done'},{id:'2',title:'Rewrite parser with a single regex',status:'done'},{id:'3',title:'Run tests and fix failures',status:'in_progress'},{id:'4',title:'Update README examples',status:'pending'}],
      messages:[
        {role:'user',content:'Make the dice notation parser more user friendly — allow spaces, a bare d6, and better errors.'},
        {role:'assistant',content:'',thinking:'The parser uses re.match with a strict pattern. I should allow optional count, whitespace, modifiers, and case-insensitivity, then raise a descriptive error.',toolCalls:[{id:'a',name:'read_file',arguments:'{"path":"dice.py"}'},{id:'b',name:'read_file',arguments:'{"path":"tests/test_dice.py"}'},{id:'c',name:'grep_search',arguments:'{"query":"roll_dice"}'}]},
        {role:'tool',toolCallId:'a',content:'File: dice.py (24 lines)\n    1 | import random\n    2 | import re'},
        {role:'tool',toolCallId:'b',content:'File: tests/test_dice.py (40 lines)'},
        {role:'tool',toolCallId:'c',content:'dice.py:4: def roll_dice(notation):\nmain.py:9: total = roll_dice(dice_notation)'},
        {role:'assistant',content:'',toolCalls:[{id:'d',name:'edit_file',arguments:JSON.stringify({path:'dice.py',old_text:oldT,new_text:newT})},{id:'e',name:'run_command',arguments:'{"command":"python -m pytest -q"}'}]},
        {role:'tool',toolCallId:'d',content:'Edited dice.py at line 4.'},
        {role:'tool',toolCallId:'e',content:'$ python -m pytest -q\n......                                                                   [100%]\n6 passed in 0.12s\n[exit code 0]'},
        {role:'assistant',content:'Simplified the parser with a single regex:\n\n- `d6` now defaults to **one** die\n- spaces are ignored, matching is case-insensitive\n- invalid input raises a descriptive `ValueError`\n\n```python\nroll_dice("3d6+2")   # 3 dice, +2\nroll_dice("D20")     # one d20\n```\n\nAll 6 tests pass. Want me to update the README examples next?'},
      ]};
    send({type:'session',session});
    send({type:'changes',sessionId:'s1',files:[{path:'dice.py',fsPath:'/x/dice.py',kind:'modify'}],checkpoints:[0]});
    if (!/live=0/.test(location.search)) {
      // Scripted live turn: the user asked for more and the agent fans out two subagents, so pause / steer / lane controls can be tried.
      const ev=(type,payload)=>send({type:'event',event:{sessionId:'s1',type,payload}});
      setTimeout(()=>{ send({type:'running',sessionId:'s1',running:true}); ev('status','Thinking with qwen2.5-coder:14b…'); },300);
      // The small-model failure mode: it announces the delegation without calling the tool. The loop nudges it; the retracted
      // sentence stays dimmed and the real answer starts in a fresh body (no more "…finish.Understood as:" run-ons).
      setTimeout(()=>ev('assistant_delta','Delegated to 4 background workers. I\'ll report back when they finish.'),700);
      setTimeout(()=>ev('nudge',{reason:'claimed'}),1000);
      setTimeout(()=>ev('assistant_delta','Understood as: update the README and tests for the new dice notation, and build the two leaderboard features in parallel.\n\nDelegated to 4 background workers. I\'ll report back when they finish.\n\n'),1200);
      setTimeout(()=>{ ev('tool_start',{id:'p1',name:'run_parallel_subagents',args:{tasks:[{agent:'docs',prompt:'Update README examples for the new dice notation'},{agent:'tester',prompt:'Add tests for 2d10 - 1 and D20 parsing'},{agent:'coder',prompt:'Add token tabs to the leaderboard'},{agent:'coder',prompt:'Implement the cmdk navigation menu'}]}}); },1400);
      setTimeout(()=>{ ev('subagent_start',{childId:'c1',agent:'docs',prompt:'Update README examples for the new dice notation. Cover d6, 3d6+2 and D20; keep the existing section order.',label:'Update README examples for the new dice notation',model:'ollama/qwen2.5-coder:14b'}); ev('subagent_start',{childId:'c2',agent:'tester',prompt:'Add tests for 2d10 - 1 and D20 parsing',model:'ollama/qwen2.5-coder:14b'}); },1900);
      setTimeout(()=>{ ev('tool_start',{childId:'c1',agent:'docs',inner:'tool_start',data:{id:'t1',name:'read_file',args:{path:'README.md'}}}); ev('tool_start',{childId:'c2',agent:'tester',inner:'tool_start',data:{id:'t2',name:'grep_search',args:{query:'roll_dice'}}}); },2400);
      if (/plan=1/.test(location.search)) { setTimeout(()=>{ send({type:'running',sessionId:'s1',running:false}); const ps={...session, mode:'plan', plan:{file:'.localpilot/plans/add-github-oauth-84bfc06a.plan.md', title:'Add GitHub OAuth Authentication', summary:'Implement GitHub OAuth 2.0 authorization code flow.'}, todos:[{id:'1',title:'Install express-session, @types/express-session, and cookie-parser packages',status:'pending',agent:'coder'},{id:'2',title:'Create src/oauth.ts with GitHub OAuth configuration and token exchange logic',status:'pending',agent:'coder'},{id:'3',title:'Create .env.example with GitHub OAuth and session configuration variables',status:'pending',agent:'docs'}]}; send({type:'session',session:ps}); },300); }
    } else {
      setTimeout(()=>send({type:'approval',id:'ap1',sessionId:'s1',title:'Run command',detail:'$ python -m pytest -q\nin DICE',kind:'terminal'}),50);
    }
  }
  // Echo the host's side of the pause / steer protocol so the controls can be exercised without VS Code.
  if(m.type==='pause'){ paused[m.sessionId]=true; send({type:'paused',sessionId:m.sessionId,paused:true,holding:false}); setTimeout(()=>send({type:'paused',sessionId:m.sessionId,paused:true,holding:true}),700); }
  if(m.type==='resume'){ paused[m.sessionId]=false; send({type:'paused',sessionId:m.sessionId,paused:false,holding:false}); setTimeout(()=>send({type:'event',event:{sessionId:m.sessionId,type:'status',payload:'Continuing (3)…'}}),400); }
  if(m.type==='steer'){ const id='st'+Date.now(); send({type:'steerQueued',sessionId:m.sessionId,id,content:m.text,images:m.images}); if(!paused[m.sessionId]){ setTimeout(()=>{ send({type:'event',event:{sessionId:m.sessionId,type:'steer',payload:{ids:[id],count:1}}}); send({type:'event',event:{sessionId:m.sessionId,type:'assistant_delta',payload:'Noted — switching to that.'}}); },900); } }
  if(m.type==='stop'){ send({type:'running',sessionId:m.sessionId,running:false}); }
  if(m.type==='suggestTasks'){ const recent=['Make the dice notation parser more user friendly','Write tests for utils']; const quick=[{kind:'fix',title:'Fix the 3 errors VS Code is showing',detail:'2 files · e.g. src/dice.py'},{kind:'review',title:'Review my uncommitted changes and tidy them up',detail:'4 changed files · finds mistakes, dead code and missing tests'},{kind:'docs',title:'Write a README that explains how to set up and run this project',detail:'Install steps, how to start it, how to run tests'},{kind:'test',title:'Run the test suite and fix anything that fails',detail:'Reports what was broken and how it was fixed'},{kind:'cleanup',title:'Resolve the 7 TODO / FIXME notes left in the code',detail:'Finishes or removes each one'},{kind:'explore',title:'Explain how this project is organised and where to start reading',detail:'A short guided tour, no changes made'}]; send({type:'taskSuggestions',source:'quick',items:quick,recent}); if(m.more){ setTimeout(()=>send({type:'taskSuggestions',source:'model',items:[{kind:'feature',title:'Let players save and reload a game',detail:'Adds a small save file and two menu options'},{kind:'fix',title:'Stop the game crashing when a dice string is empty',detail:'parser.py and the CLI entry point'}],recent}),900); } }
  if(m.type==='pauseChild'){ send({type:'paused',sessionId:m.sessionId,childId:m.childId,agent:'docs',paused:true,holding:false}); setTimeout(()=>send({type:'paused',sessionId:m.sessionId,childId:m.childId,paused:true,holding:true}),600); }
  if(m.type==='resumeChild'){ send({type:'paused',sessionId:m.sessionId,childId:m.childId,paused:false,holding:false}); }
  if(m.type==='stopChild'){ send({type:'event',event:{sessionId:m.sessionId,type:'subagent_end',payload:{childId:m.childId,agent:'docs',error:'Stopped by user'}}}); }
}});
</script>
<script src="../media/chat.js"></script>
</body></html>
