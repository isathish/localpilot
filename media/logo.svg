<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- chat bubble -->
  <path d="M60 72a22 22 0 0 1 22-22h92a22 22 0 0 1 22 22v72a22 22 0 0 1-22 22h-42l-38 32v-32H82a22 22 0 0 1-22-22z"
        fill="none" stroke="url(#accent)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- eyes -->
  <circle cx="104" cy="108" r="11" fill="#22d3ee"/>
  <circle cx="152" cy="108" r="11" fill="#6366f1"/>
  <!-- antenna -->
  <path d="M128 50V30" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="128" cy="24" r="9" fill="#22d3ee"/>
  <!-- local "chip" pins at the bottom-left -->
  <path d="M40 212h24M40 196h24M40 228h24" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
</svg>
