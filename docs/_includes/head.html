<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Apply the saved theme before first paint to avoid a flash; falls back to the OS preference.
  (function () { try { var t = localStorage.getItem('lp-theme'); if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); } } catch (e) {} })();
</script>
