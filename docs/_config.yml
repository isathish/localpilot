title: LocalPilot
tagline: Local-first AI coding agent for VS Code
description: LocalPilot is a free, open-source coding agent for VS Code that runs on local models from Ollama, LM Studio, llama.cpp or vLLM, and can install a model for you in one click. Agent mode, parallel agents, skills, subagents, screenshots, MCP and hardware-aware model management, with no subscription, account or telemetry. A private, offline alternative to GitHub Copilot, Cursor and Claude Code.
url: https://isathish.github.io
baseurl: /localpilot
repo: https://github.com/isathish/localpilot
download: https://github.com/isathish/localpilot/releases/latest/download/localpilot.vsix
marketplace: https://marketplace.visualstudio.com/items?itemName=localpilot.localpilot-agent
openvsx: https://open-vsx.org/extension/localpilot/localpilot-agent
extension_id: localpilot.localpilot-agent
releases: https://github.com/isathish/localpilot/releases
version: 1.1.2
lang: en
