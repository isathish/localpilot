title: LocalPilot
tagline: Local-first AI coding agent for VS Code
description: LocalPilot is a free, open-source AI coding agent for VS Code that runs 100% locally with Ollama, LM Studio, llama.cpp or vLLM. Agent mode, parallel agents, skills, subagents, screenshots and MCP — a private, offline alternative to GitHub Copilot, Cursor and Claude Code.
url: https://isathish.github.io
baseurl: /localpilot
repo: https://github.com/isathish/localpilot
download: https://github.com/isathish/localpilot/releases/latest/download/localpilot.vsix
releases: https://github.com/isathish/localpilot/releases
version: 0.1.1
lang: en
logo: /assets/og.png
author:
  name: Sathish
  url: https://github.com/isathish
twitter:
  card: summary_large_image
social:
  name: LocalPilot
  links:
    - https://github.com/isathish/localpilot
google_analytics: G-HS3RSBRPYC
# Add verification tokens from Google Search Console / Bing Webmaster Tools when available.
webmaster_verifications:
  google: ""
  bing: ""
keywords: >-
  local AI coding assistant, offline AI code assistant, VS Code AI agent, Ollama VS Code extension,
  LM Studio VS Code, llama.cpp VS Code, vLLM VS Code, GitHub Copilot alternative, Cursor alternative,
  Claude Code alternative, private coding assistant, self-hosted copilot, local LLM coding, qwen2.5-coder VS Code,
  AI agent VS Code extension, MCP VS Code, agentic coding, open source copilot
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og.png
  - scope:
      path: "docs"
    values:
      layout: docs
exclude:
  - README.md
nav:
