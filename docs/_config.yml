# "Ask AI" buttons rendered by _includes/ask-ai.html. Each product opens with the prompt pre-filled via its public query parameter.
# Gemini has no public prefill parameter in the Gemini app, so it uses Google AI Mode (udm=50), which is powered by Gemini.
ask_ai:
  - name: ChatGPT
    key: chatgpt
    url: https://chatgpt.com/?q=
    color: "#10a37f"
    title: Ask ChatGPT (OpenAI GPT) about this page
  - name: Claude
    key: claude
    url: https://claude.ai/new?q=
    color: "#d97757"
    title: Ask Claude (Anthropic) about this page
  - name: Perplexity
    key: perplexity
    url: https://www.perplexity.ai/search/new?q=
    color: "#20808d"
    title: Ask Perplexity about this page
  - name: Gemini
    key: gemini
    url: "https://www.google.com/search?udm=50&amp;q="
    color: "#4285f4"
    title: Ask Google Gemini (AI Mode) about this page
