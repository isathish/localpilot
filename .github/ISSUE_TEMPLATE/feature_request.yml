name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or workflow, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Screenshots or examples from other tools are welcome.
  - type: input
    id: setup
    attributes:
      label: Your setup (optional)
      placeholder: "Ollama, qwen2.5-coder:14b, 32 GB RAM"
