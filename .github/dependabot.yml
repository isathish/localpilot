version: 2
updates:
  # Workflow actions are pinned to commit SHAs (with the version in a comment); Dependabot bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # "build:" is not a releasable commit type (scripts/auto-bump.js), so dependency bumps never cut a release alone.
      prefix: build
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
