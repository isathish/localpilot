name: CI

on:
  push:
    branches: [main]
    # Everything except the website and prose, but CHANGELOG.md and MARKETPLACE.md are release inputs
    # (release notes and the Marketplace README inside the VSIX) and docs/_config.yml carries the version.
    paths: ['**', '!docs/**', '!**.md', 'CHANGELOG.md', 'MARKETPLACE.md', 'docs/_config.yml']
  pull_request:
    branches: [main]
    paths: ['**', '!docs/**', '!**.md', 'CHANGELOG.md', 'MARKETPLACE.md', 'docs/_config.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check version metadata
        run: npm run check:version
      - name: Type-check, lint, bundle
        run: npm run compile
      - name: Offline smoke tests
        run: npm run smoke
      - name: Extension Host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Extension Host tests
        if: runner.os != 'Linux'
        run: npm test
      - name: Package VSIX
        if: runner.os == 'Linux'
        run: npx @vscode/vsce package --no-dependencies --readme-path MARKETPLACE.md --out localpilot.vsix
      - name: Upload VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: localpilot-vsix
          path: localpilot.vsix
          retention-days: 14
