name: CI

on:
  push:
    branches: [main]
    # Everything except the website and prose, but CHANGELOG.md and MARKETPLACE.md are release inputs
    # (release notes and the Marketplace README inside the VSIX) and docs/_config.yml carries the version.
    paths: ['**', '!docs/**', '!**.md', 'CHANGELOG.md', 'MARKETPLACE.md', 'docs/_config.yml']
  pull_request:
    branches: [main]
    paths: ['**', '!docs/**', '!**.md', 'CHANGELOG.md', 'MARKETPLACE.md', 'docs/_config.yml']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every main commit gets a complete result; superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check version metadata
        run: npm run check:version
      - name: Type-check, lint, bundle
        run: npm run compile
      - name: Offline smoke tests
        run: npm run smoke
      - name: CLI end-to-end (providers, keys, Claude tool loop, gateway, Auto stays local)
        run: node scripts/cli-e2e.mjs
      - name: Start Redis Stack (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name lp-redis -p 16379:6379 redis/redis-stack-server:latest
          for i in $(seq 1 30); do docker exec lp-redis redis-cli ping 2>/dev/null | grep -q PONG && break; sleep 1; done
      - name: Extension Host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Extension Host tests
        if: runner.os != 'Linux'
        run: npm test
      - name: Package VSIX
        if: runner.os == 'Linux'
        run: npx @vscode/vsce package --no-dependencies --readme-path MARKETPLACE.md --out localpilot.vsix
      - name: Upload VSIX artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: localpilot-vsix
          path: localpilot.vsix
          retention-days: 14
