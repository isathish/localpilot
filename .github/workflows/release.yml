name: Release

# How a release happens
#   1. a push to main whose version is already tagged but that contains releasable commits (anything
#      except docs/chore/ci/build/test/style/release) is bumped automatically: patch by default, minor
#      for a breaking "type!:" commit, or whatever "[release patch|minor|major]" in a commit message
#      asks for. "[skip release]" anywhere in the pushed commits skips the bump. The bump job runs
#      scripts/release.js --ci (version files + changelog + compile/smoke/package check), commits
#      "release: vX.Y.Z" and re-dispatches this workflow, which then takes path 2; or
#   2. main carries a package.json version that has no vX.Y.Z tag yet (the bump job, npm run release,
#      the "Prepare release" workflow, or a hand edit of package.json + CHANGELOG.md); or
#   3. someone pushes a v*.*.* tag / runs this workflow manually.
# prepare  decides and validates metadata (versions agree, changelog section has entries)
# bump     (path 1 only) bumps the version on main and starts a new run
# verify   type-checks, lints, runs smoke + Extension Host tests and packages the VSIX
# publish  only then tags the commit, creates the GitHub Release with the changelog section as notes
#          and publishes to the VS Code Marketplace and Open VSX, then redeploys the website so it
#          shows the new version. A failed publish fails the run;
#          re-run "Publish to Marketplace" for that tag to retry without a new version.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.2.0. Leave empty to release the untagged version on main.
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      sha: ${{ steps.decide.outputs.sha }}
      tag_exists: ${{ steps.decide.outputs.tag_exists }}
      previous_tag: ${{ steps.decide.outputs.previous_tag }}
      bump: ${{ steps.decide.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Check version metadata
        run: node scripts/check-version.js
      - name: Compare package.json version with existing tags
        id: decide
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse HEAD)
          if [ -n "${{ github.event.inputs.tag }}" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.event.inputs.tag || github.ref_name }}"
            if [ "${TAG#v}" != "$PKG_VERSION" ]; then
              echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            TAG="v$PKG_VERSION"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "tag_exists=true" >> "$GITHUB_OUTPUT"
              # Already released: decide whether the commits pushed since that tag earn an automatic bump.
              BUMP=""
              if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.actor }}" != "github-actions[bot]" ]; then
                BUMP=$(node scripts/auto-bump.js "$TAG" "${{ github.event.before }}..$SHA")
              fi
              if [ -n "$BUMP" ]; then
                echo "::notice::$TAG is already released; the pushed commits earn a $BUMP bump. Bumping main and starting a new release run."
              else
                echo "::notice::$TAG already exists and the push has no releasable commits, or a commit opted out of releasing; nothing to release. Put [release patch] in a commit message to force one."
              fi
              echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::package.json is $PKG_VERSION and $TAG does not exist yet. Releasing after verification."
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          PREV=$(git tag -l 'v*' --sort=-v:refname | grep -vx "$TAG" | head -1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREV" >> "$GITHUB_OUTPUT"

  bump:
    name: Bump version & start release
    needs: prepare
    if: needs.prepare.outputs.release != 'true' && needs.prepare.outputs.bump != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Bump, verify, commit and push
        env:
          BUMP: ${{ needs.prepare.outputs.bump }}
        run: |
          # Another push may have landed since prepare ran; only bump if main still points at this run's commit.
          if [ "$(git rev-parse HEAD)" != "${{ needs.prepare.outputs.sha }}" ]; then
            echo "::notice::main moved on since this run started; the newer push will handle the bump."; exit 0
          fi
          node scripts/release.js "$BUMP" --ci --no-push
          # A push that lands while we were verifying wins; its own run performs the bump.
          if ! git push origin main; then
            echo "::notice::main moved on while verifying; the newer push will handle the bump."; exit 0
          fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Start the Release workflow
        # Pushes made with GITHUB_TOKEN do not trigger other workflow runs, so start it explicitly.
        if: env.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref main
          sleep 5
          RUN=$(gh run list --workflow=release.yml --branch main --event workflow_dispatch --limit 1 --json url --jq '.[0].url')
          {
            echo "## Auto-bumped to v${version}"
            echo ""
            echo "Committed \`release: v${version}\` to main. Release run: ${RUN:-see the Actions tab}"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Build, test & package
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check, lint, bundle
        run: npm run compile
      - name: Offline smoke tests
        run: npm run smoke
      - name: Extension Host tests
        run: xvfb-run -a npm test
      - name: Package VSIX
        run: |
          V="${{ needs.prepare.outputs.version }}"
          npx @vscode/vsce package --no-dependencies --readme-path MARKETPLACE.md --out "localpilot-$V.vsix"
          cp "localpilot-$V.vsix" localpilot.vsix
          sha256sum "localpilot-$V.vsix" localpilot.vsix > SHA256SUMS.txt
          unzip -p "localpilot-$V.vsix" extension/package.json | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s); if(p.version!==process.argv[1]){console.error("VSIX carries "+p.version+", expected "+process.argv[1]); process.exit(1)}})' "$V"
      - name: Write release notes
        run: |
          V="${{ needs.prepare.outputs.version }}"
          TAG="${{ needs.prepare.outputs.tag }}"
          PREV="${{ needs.prepare.outputs.previous_tag }}"
          awk -v v="$V" '
            /^## / { if (found) exit; if (index($0, v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '^[-*] ' RELEASE_NOTES.md; then echo "::error::CHANGELOG.md has no entries for $V"; exit 1; fi
          {
            echo ""
            echo "### Install"
            echo '```bash'
            echo "code --install-extension localpilot-$V.vsix"
            echo '```'
            echo "Or **Extensions → ··· → Install from VSIX…** in VS Code. Documentation: https://isathish.github.io/localpilot/"
            if [ -n "$PREV" ]; then echo ""; echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/$PREV...$TAG"; fi
          } >> RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: |
            localpilot-${{ needs.prepare.outputs.version }}.vsix
            localpilot.vsix
            SHA256SUMS.txt
            RELEASE_NOTES.md
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Tag, release & publish
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.prepare.outputs.version }}
      - name: Verify checksums
        run: sha256sum -c SHA256SUMS.txt

      - name: Create tag
        if: needs.prepare.outputs.tag_exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "LocalPilot $TAG" "${{ needs.prepare.outputs.sha }}"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: LocalPilot ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            localpilot-${{ env.VERSION }}.vsix
            localpilot.vsix
            SHA256SUMS.txt

      - name: Publish to VS Code Marketplace
        id: vsce
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT secret is not set; skipped the VS Code Marketplace. Add it and run 'Publish to Marketplace' for $TAG."
            echo "status=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npx @vscode/vsce publish --no-dependencies --packagePath "localpilot-$VERSION.vsix"
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX
        id: ovsx
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT secret is not set; skipped Open VSX."
            echo "status=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npx ovsx publish "localpilot-$VERSION.vsix" -p "$OVSX_PAT"
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Redeploy the website
        # The bump commit was pushed with GITHUB_TOKEN, which never triggers the Docs push workflow, so
        # the site would keep showing the previous version. Dispatch it explicitly (workflow_dispatch
        # is exempt from that rule) now that the GitHub Release the site links to exists.
        id: docs
        if: always() && needs.prepare.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh workflow run docs.yml --ref main; then
            echo "status=dispatched" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not start the Docs workflow; run it from the Actions tab so the site shows $TAG."
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## LocalPilot $TAG"
            echo ""
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| GitHub Release | https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG |"
            echo "| VS Code Marketplace | ${{ steps.vsce.outputs.status || 'failed' }} · https://marketplace.visualstudio.com/items?itemName=localpilot.localpilot-agent |"
            echo "| Open VSX | ${{ steps.ovsx.outputs.status || 'failed' }} · https://open-vsx.org/extension/localpilot/localpilot-agent |"
            echo "| Website | ${{ steps.docs.outputs.status || 'failed' }} · https://isathish.github.io/localpilot/ |"
            echo ""
            echo "Checksums:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
