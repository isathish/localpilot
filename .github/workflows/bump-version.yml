name: Prepare release

# One click from the Actions tab: bumps the version, promotes the changelog (or generates it from
# conventional commits since the last tag), verifies the build, commits "release: vX.Y.Z" to main
# and starts the Release workflow, which tests, tags, packages and publishes.
# Equivalent to running `npm run release -- <bump>` locally. Plain pushes to main already release a
# patch automatically (see release.yml); use this to choose a minor, major or custom version.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options: [patch, minor, major, custom]
      version:
        description: Exact version when bump is "custom" (e.g. 1.0.0)
        required: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version & changelog
    runs-on: ubuntu-latest
    # release.js --ci compiles, runs the smoke tests and packages the VSIX before committing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump, verify, commit and push
        env:
          BUMP: ${{ github.event.inputs.bump }}
          CUSTOM: ${{ github.event.inputs.version }}
        run: |
          if [ "$BUMP" = "custom" ]; then
            if [ -z "$CUSTOM" ]; then echo "::error::Enter a version when bump is 'custom'."; exit 1; fi
            ARG="$CUSTOM"
          else
            ARG="$BUMP"
          fi
          node scripts/release.js "$ARG" --ci
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Start the Release workflow
        # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start it explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          # A minute of slack for clock skew between the runner and GitHub.
          SINCE=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run release.yml --ref main
          # Link only the run this dispatch started: a workflow_dispatch run on the release commit, created after it
          # (a push-triggered run or another dispatch must not be mistaken for it).
          RUN=""
          for i in $(seq 1 12); do
            sleep 5
            RUN=$(gh run list --workflow=release.yml --branch main --event workflow_dispatch --commit "$HEAD_SHA" --limit 5 --json url,createdAt \
              --jq "[.[] | select(.createdAt >= \"$SINCE\")][0].url // empty")
            [ -n "$RUN" ] && break
          done
          {
            echo "## Prepared v${version}"
            echo ""
            echo "Committed \`release: v${version}\` to main. Release workflow: ${RUN:-see the Actions tab}"
          } >> "$GITHUB_STEP_SUMMARY"
