name: Docs

# Deploys the GitHub Pages site. The version shown on the site always comes from package.json at
# build time, so it can never drift from the extension that was actually released. The Release
# workflow dispatches this workflow after publishing, because pushes made with GITHUB_TOKEN
# (the "release: vX.Y.Z" bump commit) do not trigger push-based runs on their own.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'CHANGELOG.md', '.github/workflows/docs.yml', 'scripts/ga-pageviews.mjs', 'scripts/pageviews-test.mjs']
  workflow_dispatch:
  # Daily rebuild so the page view counts stay current without a push.
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync site version from package.json
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/^version:.*$/version: $V/" docs/_config.yml
          grep -q "^version: $V$" docs/_config.yml || { echo "::error::could not set version in docs/_config.yml"; exit 1; }
          echo "Building site as v$V"
      - name: Test the live page view counter
        run: node --experimental-eventsource --no-warnings scripts/pageviews-test.mjs
      - name: Page views from Google Analytics
        # Optional: without the GA_PROPERTY_ID / GA_CREDENTIALS secrets (or if the API fails) the site builds without counts.
        continue-on-error: true
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
        run: node scripts/ga-pageviews.mjs docs/_data/pageviews.json
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
