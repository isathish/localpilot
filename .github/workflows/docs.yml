name: Docs

# Deploys the GitHub Pages site. The version shown on the site always comes from package.json at
# build time, so it can never drift from the extension that was actually released. The Release
# workflow dispatches this workflow after publishing, because pushes made with GITHUB_TOKEN
# (the "release: vX.Y.Z" bump commit) do not trigger push-based runs on their own.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'CHANGELOG.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Sync site version from package.json
        run: |
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/^version:.*$/version: $V/" docs/_config.yml
          grep -q "^version: $V$" docs/_config.yml || { echo "::error::could not set version in docs/_config.yml"; exit 1; }
          echo "Building site as v$V"
      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
